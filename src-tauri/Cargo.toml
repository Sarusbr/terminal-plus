[package]
name = "terminal-plus"
version = "0.1.0"
description = "Lightweight SSH terminal"
edition = "2021"

[lib]
name = "terminal_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "fs", "process", "net"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
window-vibrancy = "0.6"
dirs = "6"
portable-pty = "0.9"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
log = "0.4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
