name: Release

# Push a tag like v0.1.0 → builds macOS (Apple Silicon) and Windows,
# uploads installers with stable file names to the GitHub Release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Terminal Plus $TAG" \
              --notes "Kurulum dosyaları aşağıda. macOS: .dmg · Windows: -setup.exe veya .msi"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            label: macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build
        shell: bash
        run: |
          VERSION="${TAG#v}"
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"$VERSION\"}"

      - name: Upload installers (stable names)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          case "${{ matrix.label }}" in
            macos-*)      cp "$B"/dmg/*.dmg "out/TerminalPlus-${{ matrix.label }}.dmg" ;;
            windows-x64)  cp "$B"/nsis/*-setup.exe "out/TerminalPlus-windows-x64-setup.exe"
                          cp "$B"/msi/*.msi "out/TerminalPlus-windows-x64.msi" ;;
          esac
          ls -la out
          gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"

  # Publish whatever built — one stuck platform must not hold back the others.
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
